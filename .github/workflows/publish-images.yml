# Build and push API + web images to Docker Hub, and sync Hub overviews.
#
# Triggers: push to main/master, version tags (v*), manual dispatch.
# Images:
#   docker.io/<DOCKERHUB_USERNAME>/ehr-risk-api
#   docker.io/<DOCKERHUB_USERNAME>/ehr-risk-web
# Default username in docs/compose: ranasl62
# Tags: latest (default branch), git SHA, and semver from v* tags.
#
# Hub full descriptions are synced from:
#   deployment/dockerhub/ehr-risk-api.md
#   deployment/dockerhub/ehr-risk-web.md
#
# Required GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub username (e.g. ranasl62)
#   DOCKERHUB_TOKEN     — Docker Hub access token with Read/Write/Delete (needed for Hub description sync)
#
# After the first successful push (maintainers):
#   1. Create repos on hub.docker.com if they do not auto-create (ehr-risk-api, ehr-risk-web)
#   2. Set visibility to Public for anonymous `docker pull`
#   3. Confirm: docker pull ranasl62/ehr-risk-api:latest
#   4. Confirm Hub Overview shows the synced README for each repo

name: Publish Docker images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: deployment/Dockerfile
            image_suffix: ehr-risk-api
            readme: deployment/dockerhub/ehr-risk-api.md
            short_description: "EHR Risk Framework API — leakage-aware FastAPI risk modeling (research/education only)"
          - name: web
            context: ./web
            file: web/Dockerfile
            image_suffix: ehr-risk-web
            readme: deployment/dockerhub/ehr-risk-web.md
            short_description: "EHR Risk Framework Angular workbench (research/education only)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Set Actions secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access token with write)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: |
          user=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${user}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional: vars.API_ENDPOINT bakes a remote API into the web image only.
          build-args: |
            API_ENDPOINT=${{ matrix.name == 'web' && vars.API_ENDPOINT || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.image.outputs.name }}
          short-description: ${{ matrix.short_description }}
          readme-filepath: ${{ matrix.readme }}
          enable-url-completion: "true"
