# Build and push API + web images to Docker Hub.
#
# Triggers: push to main/master, version tags (v*), manual dispatch.
# Images:
#   docker.io/<DOCKERHUB_USERNAME>/ehr-risk-api
#   docker.io/<DOCKERHUB_USERNAME>/ehr-risk-web
# Default username in docs/compose: ranasl62
# Tags: latest (default branch), git SHA, and semver from v* tags.
#
# Required GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub username (e.g. ranasl62)
#   DOCKERHUB_TOKEN     — Docker Hub access token with write (Account Settings → Security)
#
# After the first successful push (maintainers):
#   1. Create repos on hub.docker.com if they do not auto-create (ehr-risk-api, ehr-risk-web)
#   2. Set visibility to Public for anonymous `docker pull`
#   3. Confirm: docker pull ranasl62/ehr-risk-api:latest

name: Publish Docker images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: deployment/Dockerfile
            image_suffix: ehr-risk-api
          - name: web
            context: ./web
            file: web/Dockerfile
            image_suffix: ehr-risk-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping publish because DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN is not set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name (lowercase)
        if: steps.dockerhub.outputs.enabled == 'true'
        id: image
        run: |
          user=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${user}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.dockerhub.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
