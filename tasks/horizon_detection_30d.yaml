# Research horizon detection: binary outcome within 30 days of index_time.
# Same leakage-aware contract as readmission-style tasks. Not realtime alerting.
task:
  id: horizon_detection_30d
  name: Horizon Outcome Detection (30d)
  description: >
    Research detection task — detect whether the labeled outcome occurs within 30 days
    after index_time using only pre-index / at-index features. Batch case-finding for
    methods work; not a clinical monitor or bedside alert.

target:
  column: label

prediction:
  horizon_days: 30
  index_strategy: column
  index_time_col: index_time
  feature_inclusive: true

features:
  windows_days: [7, 30, 180]
  window_days: 180

data:
  format: longitudinal
  # Needs index_time — tiny demo CSV lacks it; use paper synthetic (or BYO cohort).
  suggested_path: data/raw/paper_synthetic_cohort.csv

training:
  model_kind: logreg
  calibrate: true
  split_by_patient: true
  temporal_split: false

evaluation:
  metrics: [roc_auc, pr_auc, brier, ece, precision, recall, f1]
