server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve `api` after container recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Angular SPA routes (/predict, /docs, …) must win over legacy API paths.
    # Inference API is under /v1/; OpenAPI remains on :8000 or /api-docs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        set $api_host api;
        proxy_pass http://$api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }
    location /health {
        set $api_host api;
        proxy_pass http://$api_host:8000/health;
    }
    location /openapi.json {
        set $api_host api;
        proxy_pass http://$api_host:8000/openapi.json;
    }
    # Swagger UI without stealing Angular /docs
    location /api-docs {
        set $api_host api;
        proxy_pass http://$api_host:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api-docs/ {
        set $api_host api;
        proxy_pass http://$api_host:8000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
