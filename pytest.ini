[pytest]
markers =
    e2e: end-to-end tests against a live API (set EHR_API_BASE, default http://127.0.0.1:8000)

addopts =
    --cov=api
    --cov=openhealth
    --cov-report=term-missing:skip-covered
    --cov-report=json:coverage-api.json
    --cov-fail-under=100

[coverage:run]
source = api,openhealth
omit =
    */tests/*

[coverage:report]
precision = 2
fail_under = 100
