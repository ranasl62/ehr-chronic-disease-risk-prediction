# One command (train-if-needed → API → Angular workbench):
#   docker compose up --build
#   make researcher-up
services:
  prepare:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      FORCE_TRAIN: ${FORCE_TRAIN:-0}
    command: ["/bin/sh", "scripts/docker_prepare.sh"]

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200
      - MAX_BODY_BYTES=52428800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Ensure multipart is present even on older images; then serve API
    command:
      - /bin/sh
      - -c
      - pip install -q 'python-multipart>=0.0.9' 'openpyxl>=3.1.0' 'PyYAML>=6.0' && exec uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      prepare:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  train:
    profiles:
      - train
    build:
      context: .
      dockerfile: deployment/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
    command:
      - python
      - -m
      - training.train
      - --format
      - longitudinal
      - --data
      - data/raw/ehr_data.csv
      - --model
      - logreg
      - --split-by-patient
