<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EHR Risk Framework">
  <defs>
    <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d8f78"/>
      <stop offset="100%" stop-color="#1f5548"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- Timeline axis -->
  <line x1="12" y1="40" x2="52" y2="40" stroke="#e8f5f0" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Lookback window (pre-index) -->
  <rect x="14" y="28" width="18" height="10" rx="2" fill="#e8f5f0" opacity="0.35"/>
  <!-- Index marker (t_index) -->
  <line x1="34" y1="18" x2="34" y2="46" stroke="#f4faf7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="34" cy="18" r="4" fill="#f7c948"/>
  <!-- Horizon ticks (post-index, empty  no features) -->
  <circle cx="42" cy="40" r="2" fill="#e8f5f0" opacity="0.55"/>
  <circle cx="48" cy="40" r="2" fill="#e8f5f0" opacity="0.35"/>
  <!-- Risk curve rising toward index -->
  <path d="M14 36 C20 34, 26 30, 34 22" fill="none" stroke="#f4faf7" stroke-width="2.25" stroke-linecap="round"/>
</svg>
